name: real-estate-backend

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: realestate_backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/nitin-real-estate
    depends_on:
      mongo:
        condition: service_healthy
    restart: always

  mongo:
    image: mongo:7
    container_name: realestate_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:

